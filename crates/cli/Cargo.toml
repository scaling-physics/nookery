[package]
name = "nookery-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nookery"
path = "src/main.rs"

[dependencies]
nookery-core.workspace = true
nookery-store.workspace = true
nookery-receipt.workspace = true
nookery-extract.workspace = true
nookery-vision.workspace = true
nookery-recipes.workspace = true
nookery-plan.workspace = true
chrono.workspace = true
clap.workspace = true
nookery-sync = { version = "0.2.0", path = "../sync" }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile.workspace = true
