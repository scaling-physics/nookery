[package]
name = "nookery-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-process language model (llama.cpp) for the phone (nookery)."

[features]
default = []
# llama.cpp via llama-cpp-2 (C++ build: Metal on macOS, CPU on Android).
llama = ["dep:llama-cpp-2"]

[dependencies]
nookery-recipes.workspace = true
thiserror.workspace = true
serde_json.workspace = true
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false, features = ["metal"] }

[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false, features = ["android-static-stdcxx"] }

[dev-dependencies]
nookery-core.workspace = true
nookery-store.workspace = true
chrono.workspace = true
tempfile.workspace = true
