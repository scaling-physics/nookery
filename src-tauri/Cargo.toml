[package]
name = "nookery"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nookery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Not "nookery": that's the CLI's binary, and both would land in
# target/<profile>/nookery and overwrite each other.
[[bin]]
name = "nookery-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
nookery-core.workspace = true
nookery-store.workspace = true
nookery-receipt.workspace = true
nookery-vision.workspace = true
nookery-recipes.workspace = true
nookery-plan.workspace = true
base64 = "0.23.1"
nookery-sync = { version = "0.1.0", path = "../crates/sync" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
libc = "0.2.191"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"

[target.'cfg(target_os = "android")'.dependencies]
nookery-llm = { version = "0.1.0", path = "../crates/llm", features = ["llama"] }
