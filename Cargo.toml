[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/receipt", "crates/extract", "crates/vision", "crates/recipes", "crates/sync", "crates/llm", "crates/plan", "crates/cli", "src-tauri"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
dirs = "7"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
nookery-core = { path = "crates/core" }
nookery-store = { path = "crates/store" }
nookery-receipt = { path = "crates/receipt" }
nookery-extract = { path = "crates/extract" }
nookery-vision = { path = "crates/vision" }
nookery-recipes = { path = "crates/recipes" }
nookery-plan = { path = "crates/plan" }

[profile.release]
lto = "thin"
codegen-units = 1

# Dependencies are fast in debug builds too (image decoding, OCR, SQLite).
[profile.dev.package."*"]
opt-level = 2
